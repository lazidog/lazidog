services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lazidog
    ports:
      - "5432:5432"
    volumes:
      - lazidog_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - lazidog_node_modules:/workspace/node_modules
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 4000
    ports:
      - "4000:4000"
    command: sh -lc "corepack enable && yarn install && yarn workspace @lazidog/db prisma:gen && yarn workspace @lazidog/db prisma:db:push && yarn workspace @lazidog/api dev"

  auth:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - lazidog_node_modules:/workspace/node_modules
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 4002
    ports:
      - "4002:4002"
    command: sh -lc "corepack enable && yarn install && yarn workspace @lazidog/db prisma:gen && yarn workspace @lazidog/db prisma:db:push && yarn workspace @lazidog/auth dev"

  worker:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - lazidog_node_modules:/workspace/node_modules
    env_file:
      - .env
    depends_on:
      - redis
    command: sh -lc "corepack enable && yarn install && yarn workspace @lazidog/worker dev"

  web:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - lazidog_node_modules:/workspace/node_modules
    env_file:
      - .env
    depends_on:
      - api
      - auth
    ports:
      - "3000:3000"
    command: sh -lc "corepack enable && yarn install && yarn workspace @lazidog/web dev"

volumes:
  lazidog_pg:
  lazidog_node_modules:
