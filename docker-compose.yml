services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lazidog
    ports:
      - "5432:5432"
    volumes:
      - lazidog_pg:/var/lib/postgresql/data

  api:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - lazidog_node_modules:/workspace/node_modules
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "4000:4000"
    command: sh -lc "corepack enable && yarn install && yarn workspace @lazidog/db prisma:generate && yarn workspace @lazidog/db prisma:push && yarn workspace @lazidog/api dev"

  auth:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - lazidog_node_modules:/workspace/node_modules
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "4002:4002"
    command: sh -lc "corepack enable && yarn install && yarn workspace @lazidog/db prisma:generate && yarn workspace @lazidog/db prisma:push && yarn workspace @lazidog/auth dev"

  gateway:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - lazidog_node_modules:/workspace/node_modules
    env_file:
      - .env
    depends_on:
      - api
      - auth
    ports:
      - "4001:4001"
    command: sh -lc "corepack enable && yarn install && yarn workspace @lazidog/gateway dev"

  web:
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - lazidog_node_modules:/workspace/node_modules
    env_file:
      - .env
    depends_on:
      - gateway
    ports:
      - "3000:3000"
    command: sh -lc "corepack enable && yarn install && yarn workspace @lazidog/web dev"

volumes:
  lazidog_pg:
  lazidog_node_modules:
